[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piece-block-editor"
version = "0.1.0"
description = "Grid-based piece editor with image-to-block reconstruction"
requires-python = ">=3.11"
dependencies = [
    "moderngl>=5.10",
    "numpy>=1.26",
    "Pillow>=10.0",
    "PySide6>=6.7",
    "trimesh>=4.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
piece-editor = "piece_editor.app:main"

[tool.setuptools.packages.find]
include = ["piece_editor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

